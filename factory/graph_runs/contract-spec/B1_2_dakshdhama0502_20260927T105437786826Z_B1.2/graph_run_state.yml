        contains residential; closed accessorials list; no invoice adjustments; document
        rules for credit notes, 45-day dispute window, 30-day payment; term 2024-12-01..2026-11-30.
        Checker OK (108 shipments), SH-4005 and SH-4007 verified by hand.'
      notes: "Ambiguities recorded:\n- weight_band_gap_500_501 (\xA71): billed weights\
