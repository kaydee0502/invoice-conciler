      notes: "Ambiguities recorded:\n- weight_band_gap_500_501 (\xA71): billed weights\
        \ strictly between 500 and 501 kg fall in no band\n  (\"up to and including\
        \ 500 kg\" vs \"501 kg to 2,000 kg\"); when = billed_weight_kg gt 500 and\
        \ lt 501.\n- residential_unflagged_residence (\xA74): charge also applies\
        \ where consignee address is a residence\n  even if not flagged; shipment\
        \ data carries only the residential flag, so unflagged residences cannot\n\
