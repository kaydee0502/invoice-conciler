        1); express_premium 15% of base_freight when service_level=express (\xA72);\
        \ fuel_surcharge 12% of base_freight+express_premium (\xA73); residential_delivery\
        \ 250.00 flat when special_handling contains residential (\xA74); closed_list\
        \ accessorials (\xA75); no invoice adjustments; document rules for payment/invoicing\
        \ (\xA76), 45-day dispute window (\xA77), credit notes (\xA78); term 2024-12-01..2026-11-30.\
        \ Checker OK; SH-4005 and SH-4007 verified by hand."
      notes: "Ambiguities recorded:\n- weight_band_gap_500_501 (\xA71): billed weight\
        \ strictly between 500 and 501 kg falls in neither band\n  (\"up to and including\
        \ 500 kg\" vs \"501 kg to 2,000 kg\"); tiers kept literal, when = 500 < billed_weight_kg\
        \ < 501.\n- residential_unflagged_address (\xA74): charge also applies where\
        \ the consignee address is a residence\n  even if not flagged; the shipment\
        \ record only exposes the 'residential' flag, so the spec charges it\n  only\
        \ when flagged. No `when` (not expressible from available fields).\n"
