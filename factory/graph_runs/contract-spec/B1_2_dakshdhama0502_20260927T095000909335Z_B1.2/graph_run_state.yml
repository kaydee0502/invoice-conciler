      summary: "Encoded falcon-freight.md as spec_b.json: base_freight (per-km, tiered\
        \ on billed_weight_kg: <=500kg @ \u20B918/km, 501-2000kg @ \u20B924/km, >2000kg\
        \ out_of_card per \xA71), express_premium (15% of base_freight when service_level=express,\
        \ \xA72), fuel_surcharge (12% of base_freight+express_premium, \xA73), residential_delivery\
        \ (flat \u20B9250 when special_handling contains residential, \xA74), closed\
        \ accessorials_policy (\xA75), document_rules for fortnightly invoicing/30-day\
        \ payment (\xA76), 45-day dispute window (\xA77), and credit notes (\xA78);\
        \ no invoice_adjustments stated in the contract."
      notes: "Checker run against factory/flows/freight-recon/reconlib/speccheck reported\
        \ OK\n(valid schema, priced 108 sample shipments without error); hand-verified\
        \ two\nsample lines (SH-4001, SH-4007) against the contract text and they\
        \ match.\n\nOne ambiguity recorded in the spec: \xA71's base freight weight\
        \ bands are\nwritten literally as \"up to and including 500 kg\" and \"501\
        \ kg to 2,000 kg\",\nwhich leaves the fractional interval strictly between\
        \ 500 and 501 kg (e.g.\n500.5 kg) uncovered by either band. Per the encoding\
        \ rules this gap was not\nclosed by assumption -- it is declared in `ambiguities`\
        \ with a `when`\ncondition identifying billed_weight_kg in (500, 501) exclusive,\
        \ so the\nengine will report such shipments as undetermined rather than silently\n\
        picking a rate.\n\nConsignments above 2,000 kg are encoded as an explicit\
        \ out_of_card tier\n(contract says these are \"quoted case by case,\" outside\
        \ the rate card --\nnot an omission).\n\ncold_chain and fragile special_handling\
        \ flags have no matching charge in\nthe contract; since \xA75 explicitly closes\
        \ the accessorial list (\"No other\naccessorial charges are payable\"), this\
        \ was treated as a determined \"no\ncharge\" outcome rather than an ambiguity.\n"
