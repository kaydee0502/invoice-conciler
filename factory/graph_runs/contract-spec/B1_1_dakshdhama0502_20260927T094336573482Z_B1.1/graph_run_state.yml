      notes: "Ambiguities recorded:\n- weight_exactly_50kg (\xA72): rates are given\
        \ for 'under 50 kg' and 'over 50 kg' only; a chargeable\n  weight of exactly\
        \ 50 kg falls in neither band, so it is left undetermined\n  (when: chargeable_weight_kg\
        \ eq 50). SH-4111 and SH-4198 (50.0 kg) price as UNDETERMINED.\nOther caveats:\
