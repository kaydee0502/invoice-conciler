      notes: "One genuine contract ambiguity recorded: the rate card gives \u20B9\
        9.50/kg for\n\"under 50 kg\" and \u20B98.25/kg for \"over 50 kg\" chargeable\
        \ weight, leaving\nexactly 50 kg uncovered by either tier (\xA72). Encoded\
        \ the tiers literally\n(lt 50 / gt 50) rather than closing the gap, and added\
        \ an ambiguities\nentry with a when-condition identifying it (qty chargeable_weight_kg\
        \ eq\n50). The checker correctly reports these shipments (SH-4111, SH-4198)\
        \ as\nUNDETERMINED.\n\naccessorials_policy.closed_list was set to false: the\
        \ contract never\nstates that charges outside its schedule are unpayable,\
        \ it simply lists\nonly two charges (freight and fragile handling).\n\nspecial_handling\
        \ values cold_chain and residential, and service_level\nexpress, are not addressed\
        \ anywhere in the contract (\xA73 explicitly says\nexpress is not offered),\
